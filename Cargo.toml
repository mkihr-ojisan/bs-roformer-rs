[package]
name = "bs-roformer-rs"
version = "0.1.0"
edition = "2024"

[features]
flex = ["burn/flex"]
cuda = ["burn/cuda", "burn/fusion", "burn/autotune", "burn/persistence"]

[dependencies]
burn = { version = "0.22.1", default-features = false, features = ["std", "pytorch"] }
realfft = "3.5.1"
thiserror = "2.0.21"

[dev-dependencies]
burn = { version = "0.22.1", default-features = false, features = ["flex"] }
